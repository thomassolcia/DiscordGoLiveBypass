name: release

# Compila aqui, com log público, para o .exe da Release ficar ligado ao commit que o gerou.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# Republicar a mesma tag cancela a execução anterior, mesmo no meio da publicação, porque a
# nova apaga e refaz a release do zero.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    # Leva de 1 a 2 minutos. Sem limite, um passo pendurado ficaria 6 horas cobrando em dobro.
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Compilacao fora de tag nao vira release, entao fica marcada como dev: assim o
      # binario nao se compara com a ultima release e nao avisa de atualizacao a toa.
      - name: Definir versao
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}"
          if (-not $versao.StartsWith('v')) { $versao = 'dev' }
          "VERSAO=$versao" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      # O mesmo script de quem compila em casa: baixa o WireGuardNT com hash fixo, grava a
      # identificacao e o driver como recurso do PE e compila com ele embutido.
      - name: Compilar
        shell: pwsh
        run: ./Compilar.ps1 -Versao $env:VERSAO

      - name: Empacotar e gerar somas
        shell: pwsh
        run: |
          $versao = $env:VERSAO
          $zip = "DiscordGoLiveBypass-$versao-windows-amd64.zip"

          Compress-Archive -Force -DestinationPath $zip -Path DiscordGoLiveBypass.exe, Validar-rota.ps1, README.md, LICENSE, LICENCA-WireGuardNT.txt

          $linhas = foreach ($arquivo in @($zip, 'DiscordGoLiveBypass.exe')) {
            '{0}  {1}' -f (Get-FileHash $arquivo -Algorithm SHA256).Hash, $arquivo
          }
          $linhas | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

          "ZIP=$zip" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      # Em repositório privado a atestação pode não estar disponível, e aí o passo cai sozinho.
      - name: Atestar procedencia
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: DiscordGoLiveBypass.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $arquivos = @("$env:ZIP", "DiscordGoLiveBypass.exe", "SHA256SUMS.txt")

          # Republicar a mesma tag refaz a release do zero, inclusive as notas: manter as
          # antigas deixaria descrição de um build que não existe mais.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
          }
          # Versão que muda o jeito de usar ganha nota escrita à mão, porque a lista automática
          # de commits não diz a quem atualiza o que fazer diferente. Sem nota, fica a lista.
          $notas = ".github/notas-de-versao/$tag.md"
          if (Test-Path $notas) {
            gh release create $tag $arquivos --title $tag --notes-file $notas
          } else {
            gh release create $tag $arquivos --title $tag --generate-notes
          }

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: DiscordGoLiveBypass-windows-amd64
          path: |
            DiscordGoLiveBypass.exe
            SHA256SUMS.txt
